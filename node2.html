<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node 2 — Logic Gate Lockdown</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Courier New', monospace;
      background: #0a0a0a;
      color: #00ff00;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .timer {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 1.5rem;
      background: #111;
      padding: 10px 20px;
      border: 1px solid #00ff00;
      border-radius: 5px;
    }
    h2 {
      margin-top: 60px;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #00ff00;
    }
    p {
      margin-bottom: 15px;
      max-width: 500px;
    }
    input[type="text"] {
      background: #111;
      border: 1px solid #00ff00;
      color: #00ff00;
      padding: 10px;
      font-size: 1.2rem;
      text-align: center;
      width: 150px;
      margin-bottom: 15px;
    }
    button {
      background: transparent;
      border: 2px solid #00ff00;
      color: #00ff00;
      padding: 10px 30px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    button:hover {
      background: #00ff00;
      color: #0a0a0a;
    }
    .feedback {
      margin-top: 15px;
      font-size: 1.2rem;
      min-height: 30px;
    }
  </style>
</head>
<body>
  <div id="timer" class="timer">45:00</div>
  <h2>Node 2 — Logic Gate Lockdown</h2>
  <p>Complete the truth table and compute the final output.</p>
  <p>Enter the 3-digit code:</p>
  <input id="code2" type="text" maxlength="3" placeholder="Code">
  <button onclick="checkCode2()">Unlock Door</button>
  <div id="feedback" class="feedback" aria-live="polite"></div>

  <script>
    // ===== TIMER =====
    let timeLeft = 45 * 60;
    let timerInterval;

    function startTimer() {
      const timerDisplay = document.getElementById('timer');
      if (!timerDisplay) return;
      timerInterval = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          alert('⏰ Time is up! The AI purged the system.');
          window.location.href = 'index.html';
        }
        timeLeft--;
      }, 1000);
    }

    if (document.getElementById('timer')) startTimer();

    // ===== NAVIGATION =====
    function goToNode(node) {
      window.location.href = `node${node}.html`;
    }

    // ===== CHECK CODE FOR NODE 2 =====
    function checkCode2() {
      const input = document.getElementById('code2');
      const feedback = document.getElementById('feedback');
      const correctCode = '731';

      if (!input || !feedback) {
        console.error('Missing input or feedback element');
        return;
      }

      const userCode = input.value.trim();

      if (userCode === correctCode) {
        feedback.textContent = '✅ Access Granted. Door Unlocked.';
        feedback.style.color = '#0f0';
        input.disabled = true;
        setTimeout(() => goToNode(3), 1000);
      } else {
        feedback.textContent = '❌ Access Denied. Try again.';
        feedback.style.color = '#f00';
        input.value = '';
        input.focus();
      }
    }
  </script>
</body>
</html>
</html>
